# SYNTHETIC NUMERICAL BENCHMARK - NOT LITERATURE TRISO DATA
# Homogeneous sphere: five layers of the same diffusivity, so the closed-form series of
# the homogeneous sphere with a kernel-step start applies. The step is end / 200 with
# end = 0.5 R^2 / D (R = 4.5e-4 m, D = 1e-10 m^2/s), exactly representable.
case_name = "synthetic-homogeneous-sphere"
species = "synthetic"
temperature_k = 1000.0

[[regions]]
name = "Kernel"
outer_radius_m = 2.0e-4
diffusivity_m2_s = 1.0e-10
cells = 40

[[regions]]
name = "Buffer"
outer_radius_m = 3.0e-4
diffusivity_m2_s = 1.0e-10
cells = 40

[[regions]]
name = "IPyC"
outer_radius_m = 3.5e-4
diffusivity_m2_s = 1.0e-10
cells = 40

[[regions]]
name = "SiC"
outer_radius_m = 4.0e-4
diffusivity_m2_s = 1.0e-10
cells = 40

[[regions]]
name = "OPyC"
outer_radius_m = 4.5e-4
diffusivity_m2_s = 1.0e-10
cells = 40

[initial]
kernel_concentration_mol_m3 = 1.0

[time]
dt_s = 5.0625
end_time_s = 1012.5
output_every_steps = 5

[output]
directory = "results/btcs-regression-homogeneous"
