name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (the package and the wrapper crate, which is a workspace of its own)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/strato-wasm/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit, integration, analytical series and BTCS regression tests
        run: cargo test --all-targets
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Release build
        run: cargo build --release
      - name: Numerical verification (BTCS against the independent references; every checkpoint is asserted)
        run: |
          set -o pipefail
          cargo run --release --example btcs_regression -- --commit "$GITHUB_SHA" | tee verify_stdout.txt
          grep -q "BTCS_REGRESSION_CHECK PASS" verify_stdout.txt
      - name: Synthetic five-layer run
        run: |
          set -o pipefail
          cargo run --release --bin strato-btcs -- inputs/synthetic/synthetic_five_layer.toml | tee main_run_stdout.txt
      - name: Record toolchain
        run: |
          rustc --version | tee toolchain.txt
          cargo --version | tee -a toolchain.txt
          echo "commit=$GITHUB_SHA" | tee -a toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            verify_stdout.txt
            main_run_stdout.txt
            toolchain.txt
            results/

  results:
    name: Shared results (every file of data/results is current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      # Regenerates every result in memory and fails, naming the files, if a committed file
      # differs (the lines that record the commit are ignored). A stale file fails the build.
      - name: strato-results run --check
        run: cargo run --locked --release --manifest-path crates/Cargo.toml -p strato-results -- run --check
      # The committed files are those of this platform (Linux, the runner of this workflow): the
      # libm of another platform differs in the last digits of the Method B series and of the
      # run hashes, so a bit-exact check holds on one platform only. The files regenerated here
      # are attached to every run; when the check fails, take them from the run and commit them.
      - name: Regenerate on this platform and attach the files
        if: always()
        run: cargo run --locked --release --manifest-path crates/Cargo.toml -p strato-results -- run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-results-linux
          path: data/results/

  python-reference:
    name: Analytical series against the independent Python reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the two packages of the reference check (versions of requirements.lock.txt)
        run: python -m pip install numpy==2.2.6 mpmath==1.3.0
      - name: Reference check (the Sturm-Liouville series of the synthetic case, 50-digit arithmetic)
        run: |
          set -o pipefail
          python -I -X utf8 scripts/derivation_checks/sec1_synthetic_case.py | tee python_reference_stdout.txt
          grep -q "SUMMARY 24/24 PASS" python_reference_stdout.txt

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
