name: Web demo

# Web demonstration of STRATO (prompt/TECHNICAL_ARCHITECTURE.md Section 7). ci.yml and docs-pdf.yml
# are unchanged; this workflow adds the web checks: generated data checks, the research catalogue
# check and its fixture tests, the wasm wrapper tests (native parity with tests/golden/v1.0), the
# wasm build with its export and size check, the precomputed-data regeneration check (which also
# compares the native CLI output with tests/golden/v1.0 as docs/development/provenance.md Section 3
# describes), lint, type check, unit tests, build, content check, browser tests (including the
# browser parity tests and the self-test) and the build artefact.
#
# Documents (web phase 8): after the Vite build, crates/strato-docsite (a Rust tool in the tools
# workspace crates/Cargo.toml) renders the derivation and register documents of docs/mathematics/
# and data/reference/ into web/dist with the mathematics typeset in the browser by the KaTeX copy
# the site ships; prompt/, the README, the CHANGELOG and docs/development/ are not published. Its
# link check then fails the job if any link of the built site does not resolve, and the content
# check runs on the complete site.
#
# Deployment: on main (push or manual run) the build that passed every step above, documents
# included, is published to GitHub Pages by the deploy job. The repository's Pages source is
# "GitHub Actions" (switched by the owner on 2026-11-25). Should the source ever be set back to
# "Deploy from a branch", the deploy job fails at its only step; after switching it back, a manual
# run (workflow_dispatch on main) publishes the site again.

on:
  push:
    branches: [main, feat/strato-interactive-web-demo]
    paths:
      - 'web/**'
      - 'scripts/web/**'
      - 'inputs/**'
      - 'data/research/**'
      - 'data/nuclear/decay.csv'
      - 'data/colormaps/**'
      - 'data/geometry/**'
      - 'data/diffusivity/**'
      - 'data/nuclear/**'
      - 'data/temperature/**'
      - 'data/experimental/**'
      - 'docs/research/**'
      - 'docs/mathematics/**'
      - 'data/reference/**'
      - 'prompt/PROGRESS.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/golden/**'
      - 'crates/**'
      - '.github/workflows/web.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The generated case files record the last commit of their input file, so the
          # regeneration check needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generated data equal a fresh regeneration
        working-directory: .
        run: python3 -I -X utf8 scripts/web/generate_data.py case inputs/synthetic/synthetic_five_layer.toml --check
      - name: Research catalogue equals a fresh regeneration
        working-directory: .
        run: python3 -I -X utf8 scripts/web/generate_data.py catalogue --check
      - name: Colour tables and AGR-1 reference geometry equal a fresh regeneration
        working-directory: .
        run: |
          python3 -I -X utf8 scripts/web/generate_data.py colormaps --check
          python3 -I -X utf8 scripts/web/generate_data.py geometry --check
      - name: Research catalogue check (prompt/TECHNICAL_ARCHITECTURE.md Section 5.2)
        working-directory: .
        run: python3 -I -X utf8 scripts/web/check_catalogue.py
      - name: Catalogue check fails on each of its bad fixtures
        working-directory: .
        run: python3 -I -X utf8 scripts/web/tests/test_check_catalogue.py
      - name: Entry texts of the research catalogue convert without loss
        working-directory: .
        run: python3 -I -X utf8 scripts/web/tests/test_catalogue_blocks.py
      - name: Rust toolchain with the wasm target
        working-directory: .
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt
          rustc -V
          cargo -V
      - name: Cache the wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}
      - name: Install the wasm-bindgen CLI at the version of crates/strato-wasm/Cargo.lock
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Wrapper tests (native parity with tests/golden/v1.0)
        working-directory: .
        run: cargo test --locked --manifest-path crates/strato-wasm/Cargo.toml
      - name: Build the wasm module, check its exports and size
        working-directory: .
        run: sh scripts/web/build_wasm.sh
      - name: Precomputed results equal a fresh regeneration; the native run equals tests/golden/v1.0
        working-directory: .
        run: sh scripts/web/precompute.sh --check
      - name: Guide lines of the convergence plots equal a fresh regeneration
        working-directory: .
        run: python3 -I -X utf8 scripts/web/generate_data.py figures --check
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
      # The tools workspace (crates/Cargo.toml) is not checked by ci.yml, which stays unchanged.
      - name: Tools workspace format, lint and tests (crates/Cargo.toml)
        working-directory: .
        run: |
          cargo fmt --manifest-path crates/Cargo.toml --all --check
          cargo clippy --locked --manifest-path crates/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/Cargo.toml
      # The six register files of data/ against every consistency check of the Python audit scripts, in Rust (crates/strato-data/CHECKS.md).
      - name: Register data layer checks (data/ files)
        working-directory: .
        run: cargo run --locked --release --manifest-path crates/Cargo.toml -p strato-data -- check --repo .
      - name: Render the derivation and register documents into the build
        working-directory: .
        run: cargo run --locked --release --manifest-path crates/Cargo.toml -p strato-docsite -- build --repo . --out web/dist --commit "$GITHUB_SHA"
      - name: Every link of the built site resolves
        working-directory: .
        run: cargo run --locked --release --manifest-path crates/Cargo.toml -p strato-docsite -- check-links web/dist --base /STRATO/
      - name: Content check of the build (demonstration and documents)
        run: npm run check:content
      - name: Install the browser
        id: browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: npx playwright test --project=chromium
      # The frame-rate tests (tagged @perf) run on their own with one worker, after the other
      # browser tests, so no other browser shares the runner while a frame rate is measured. They
      # also run when the step above failed, so their result is always recorded.
      - name: Browser frame-rate tests (one worker, nothing else running)
        if: (success() || failure()) && steps.browser.outcome == 'success'
        env:
          PW_REPORT_DIR: playwright-report-performance
        run: npx playwright test --project=performance
      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/playwright-report-performance/
          if-no-files-found: ignore
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
      # Only a build of main that passed every step above becomes the Pages artefact.
      - name: Upload the Pages artefact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails here if the Pages source is "Deploy from a branch"; see the note at the top.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Explain a failed deployment
        if: failure()
        run: |
          echo "::error title=GitHub Pages deployment failed::The verified build was not published. If the log above reports that Pages is not enabled or not set to GitHub Actions, set Settings > Pages > Build and deployment > Source to 'GitHub Actions' and re-run this workflow on main (Actions > Web demo > Run workflow). The build itself passed every check of the web job."
          exit 1
