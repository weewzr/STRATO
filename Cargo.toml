[package]
name = "strato"
version = "2.0.0"
edition = "2021"
description = "STRATO: Spherical TRISO Analysis and Transport Operations. Fission-product diffusion in multilayer TRISO fuel particles, solved by a spherical backward-time centred-space (BTCS) finite-difference scheme and by Sturm-Liouville eigenfunction expansion."
license = "AGPL-3.0-only"
repository = "https://github.com/weewzr/STRATO"
readme = "README.md"
keywords = ["nuclear", "triso", "diffusion", "finite-difference", "btcs", "sturm-liouville"]
categories = ["science", "simulation"]

[lib]
name = "strato"
path = "src/lib.rs"

[[bin]]
name = "strato-btcs"
path = "src/bin/strato_btcs.rs"

[features]
# The estimate of the error of the Method B extensions (module `analytical::extension_floor`,
# Document 6, Section 8): references and measurement code for tests and for the table example.
# Off by default so that the library (and the WebAssembly build) does not carry it.
extension-estimate = []

[[example]]
name = "extension_floor_table"
required-features = ["extension-estimate"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
csv = "1"

[profile.release]
debug = false
