# Shared pandoc settings for the STRATO documentation PDFs (see .github/workflows/docs-pdf.yml).
pdf-engine: xelatex
standalone: true
resource-path: ["."]
filters:
  - ${.}/table-caption.lua
  - ${.}/table-widths.lua
  - ${.}/break-long-tokens.lua
  - ${.}/keep-code-together.lua
variables:
  documentclass: article
  papersize: a4
  fontsize: 11pt
  geometry: "margin=2.2cm"
  mainfont: "DejaVu Serif"
  sansfont: "DejaVu Sans"
  monofont: "DejaVu Sans Mono"
  mathfont: "Latin Modern Math"
  linkcolor: "blue"
  urlcolor: "blue"
  colorlinks: true
  toc: true
  toc-depth: 2
  header-includes:
    - \usepackage{float}
    - \usepackage{xurl}
    - \usepackage{caption}
    - \captionsetup{labelformat=empty,font=small}
    - \floatplacement{figure}{H}
    - \usepackage{etoolbox}
    - \usepackage{needspace}
    - \newcommand{\tablefont}{\footnotesize}
    - \AtBeginEnvironment{longtable}{\tablefont\renewcommand{\arraystretch}{1.18}}
    - \usepackage{fvextra}
    - \fvset{breaklines=true,breakautoindent=true}
    - \AtBeginEnvironment{Shaded}{\scriptsize}
    - \setlength{\emergencystretch}{8em}
    - \allowdisplaybreaks
    - \setlength{\lineskiplimit}{2pt}
    - \setlength{\lineskip}{3pt}
highlight-style: tango
